  notes: |
    Added in Wave 2 of country expansion. Cited gov source: be.brussels — the Brussels-Capital
    Region official portal's Psychological help page. Federal Belgium delegates mental-health
    policy to the linguistic communities/regions, so this regional gov portal is the highest-level
    authoritative consolidation of crisis lines available.
    Maintainer should re-verify each entry against the source page, then flip to verified.
