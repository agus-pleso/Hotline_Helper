hotlines:
  - id: ch-143-die-dargebotene-hand
    name: Die Dargebotene Hand 143
    aliases:
      - La Main Tendue
      - Telefono Amico
    categories: [suicide, mental_health, crisis]
    contacts:
      phone: "143"
      chat_url: https://www.143.ch
      website: https://www.143.ch
    languages: [de, fr, it]
    hours:
      type: 24/7
    cost: free
    operator: ngo_government_funded
    operator_name: Verband Die Dargebotene Hand (signposted by BAG)
    notes: |
      Available in German, French, and Italian. Calls are confidential and free of charge.
      Anonymous email and chat counselling are also offered via the website.
    source:
      name: Bundesamt für Gesundheit (BAG) — Action plan on suicide prevention
      url: https://www.bag.admin.ch/en/action-plan-on-suicide-prevention
      type: government
      last_verified: 2026-05-08

  - id: ch-143-en-heart2heart
    name: Heart2Heart — English support line
    categories: [suicide, mental_health, crisis]
    contacts:
      phone: "0800 143 000"
      website: https://www.143.ch/en/
    languages: [en]
    hours:
      details: Daily 18:00–23:00 (CET/CEST)
    cost: free
    target_population: English-speaking residents in Switzerland
    operator: ngo_government_funded
    operator_name: Verband Die Dargebotene Hand
    source:
      name: Bundesamt für Gesundheit (BAG) — Action plan on suicide prevention
      url: https://www.bag.admin.ch/en/action-plan-on-suicide-prevention
      type: government
      last_verified: 2026-05-08

