  notes: |
    Added in Wave 2 of country expansion. Cited gov source: Hrvatski zavod za javno
    zdravstvo (HZJZ — Croatian Institute of Public Health). Croatia does not have a single
    state-run 24/7 suicide-prevention line that is signposted by HZJZ; the long-known
    Plavi telefon (01 4833 888) is NOT listed on the HZJZ page so is intentionally omitted.
    Maintainer should re-verify each entry against the source page, then flip to verified.
