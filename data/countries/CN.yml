  notes: |
    Added in Wave 3 of country expansion. Cited gov source: National Health Commission of
    the PRC and the State Council. NHC has not yet published a single canonical roster page
    listing 12356 with full hours/languages/operator metadata; coverage and hours vary by
    provincial implementation. Maintainer should re-verify against the source pages and
    update hours when NHC publishes a more detailed national page, then flip to verified.
