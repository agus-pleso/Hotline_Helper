  notes: |
    Added in Wave 2 of country expansion. Cited gov source: Ministry of Health (Republic of Cyprus).
    The gov.cy/moh page returned 403 to bot fetches; entries corroborated via search snippets and
    the gov-supported ONEK youth-organization helpline directory. The Council of Ministers approved
    a National Mental Health Strategy 2025–2028 in March 2025.
    Maintainer should manually open the source URL, confirm hours/operator details
    (several `unknown` placeholders), then flip to verified.
