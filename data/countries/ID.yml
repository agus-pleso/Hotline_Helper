hotlines:
  - id: id-healing119
    name: Healing119.id (formerly SEJIWA / Sehat Jiwa)
    categories: [suicide, mental_health, crisis]
    contacts:
      phone: "119"
      chat_url: https://www.healing119.id
      website: https://www.healing119.id
    languages: [id]
    hours:
      type: 24/7
      details: 24/7 phone access; counselor-staffed hours expanding (queues reported).
    cost: free
    target_population: general public — youth, workers, caregivers, those with limited mental-health access
    operator: government
    operator_name: Kementerian Kesehatan Republik Indonesia (Kemenkes RI), in collaboration with PDSKJI
    notes: Dial 119, then press extension 8 for mental-health counselling.
    source:
      name: Kemenkes — Direktorat Kesehatan Jiwa, Primer & Komunitas
